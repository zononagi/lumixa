appId: com.lumixa.ide
productName: Lumixa
copyright: Copyright © 2025 Nagisa Dozono

directories:
  output: dist
  buildResources: build

# electron-vite emits to out/; package that plus production deps.
files:
  - out/**/*
  - package.json
  - resources/**
  - '!**/*.map'

# Ship the icon into the installed app at $INSTDIR\resources\icon.ico so the
# NSIS shortcuts (build/installer.nsh) can reference it — never a dev-only path.
extraResources:
  - from: resources/icon.ico
    to: icon.ico

npmRebuild: false
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  # Single source of truth for the app icon — the same file the running window
  # uses (see src/main/index.ts). electron-builder auto-generates the .ico for
  # the installer, uninstaller and shortcuts from this PNG.
  icon: resources/icon.ico
  # rcedit exe-icon stamping needs electron-builder's winCodeSign cache, whose
  # macOS symlinks can't be extracted here without Developer Mode/admin. Instead
  # we ship resources/icon.ico and point the NSIS shortcuts at it explicitly
  # (see build/installer.nsh), so the installed app shows the Lumixa icon.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumixa
  # Hyphenated name so the URL has no spaces (matches the README download link).
  artifactName: ${productName}-Setup-${version}.${ext}
  # Point the installed shortcuts at the bundled resources/icon.ico.
  include: build/installer.nsh

# macOS target (for future cross-builds; ignored on Windows-only runs).
mac:
  target: dmg
  icon: resources/icon.png
  category: public.app-category.developer-tools

linux:
  target: AppImage
  icon: resources/icon.png
  category: Development
